name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Setup Mago
        uses: nhedger/setup-mago@v1

      - name: Setup jscpd
        run: npm install -g jscpd@5

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify composer scripts
        run: |
          php -r '$req=["format:check","lint","typecheck","quality:filesize","quality:dupes","quality:depcheck","quality:security"]; $c=json_decode(file_get_contents("composer.json"),true); $s=$c["scripts"]??[]; $m=array_values(array_filter($req, fn($x)=>!isset($s[$x]))); if($m){fwrite(STDERR,"Missing composer scripts: ".implode(", ",$m)."\n"); fwrite(STDERR,"Merge assets/configs/composer-scripts.fragment.json or provide intentional replacements before enabling this workflow.\n"); exit(1);} echo "All required composer scripts present\n";'

      - name: Format
        run: composer run format:check

      - name: Lint
        run: composer run lint

      - name: Typecheck
        run: composer run typecheck

      - name: File length
        run: composer run quality:filesize

      - name: Duplication
        run: composer run quality:dupes

      - name: Dependency hygiene
        run: composer run quality:depcheck

      - name: Security audit
        run: composer run quality:security

      # Advisory (non-blocking): surfaces cognitive complexity + method length.
      # phpcca does not fail on a threshold breach, so this never blocks the gate.
      - name: Maintainability (advisory)
        run: composer run quality:maintainability || true

  # The storefront's compiled JS is committed so the plugin works on install without a Node
  # toolchain in the merchant's shop — the same reason SwagPayPal ships its dist. That makes it an
  # artefact which can silently disagree with its source, which is the failure shape
  # docs/HANDOFF.md records as "a command's own success output is not evidence that it did what was
  # intended".
  #
  # **A byte-for-byte diff cannot be the check.** Measured: the build is deterministic at a given
  # path but path-dependent across paths — webpack derives module ids from the absolute path, so the
  # same source built at /Users/... and at /tmp/... yields identical chunk bodies under different
  # names (c9d005/a1be41 vs 887a43/631d22). A rebuild-and-diff job would therefore fail on every
  # run in CI regardless of whether dist actually matches src, which is worse than no check.
  #
  # So this job asserts the two things that are actually assertable:
  #   1. the source still compiles;
  #   2. nobody changed src without rebuilding dist.
  #
  # Honest limit: (2) is satisfied by any dist change, so it catches the forgotten rebuild — the
  # real mistake — and not a deliberately falsified one.
  storefront-dist:
    name: Storefront dist keeps up with src
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Setup shopware-cli
        uses: shopware/shopware-cli-action@v3

      - name: Storefront source compiles
        run: composer run build:storefront

      - name: Fail when src changed without a dist rebuild
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD^)"; fi

          changed_src="$(git diff --name-only "$base" HEAD -- src/Resources/app/storefront/src | wc -l | tr -d ' ')"
          changed_dist="$(git diff --name-only "$base" HEAD -- src/Resources/app/storefront/dist | wc -l | tr -d ' ')"

          echo "storefront src files changed:  $changed_src"
          echo "storefront dist files changed: $changed_dist"

          if [ "$changed_src" -gt 0 ] && [ "$changed_dist" -eq 0 ]; then
            echo "::error::Storefront source changed but the committed dist did not. Run 'composer run build:storefront' and commit the result, or the shop will keep serving the previous JavaScript."
            exit 1
          fi

          echo "Committed dist keeps up with src."
