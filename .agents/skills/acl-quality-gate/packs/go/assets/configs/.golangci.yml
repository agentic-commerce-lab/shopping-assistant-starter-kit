# golangci-lint v2 strict config for the ACL quality gate (Go pack).
# Realizes the shared threshold-parity targets (pack-authoring.md §3) and the
# conventions.md bindings. Relax only for a framework/generated path, scoped to
# that path. Validate with: golangci-lint config verify
version: "2"

run:
  # Type-check tests too; they are part of the module.
  tests: true
  # Keep the run bounded; raise only for very large modules.
  timeout: 5m

linters:
  # Start from no linters and enable an explicit, auditable set.
  default: none
  enable:
    # --- correctness / safety (the strictness slot) ---
    - errcheck        # unchecked errors
    - govet           # the vet suite
    - staticcheck     # SA/ST/QF bug + simplification checks
    - ineffassign     # ineffective assignments
    - unused          # unused vars/consts/types/funcs
    - errorlint       # %w wrapping, errors.Is/As correctness
    - nilerr          # returning nil after a non-nil err
    - bodyclose       # unclosed HTTP response bodies
    - rowserrcheck    # unchecked sql.Rows.Err
    - sqlclosecheck   # unclosed sql.Rows/Stmt
    - gosec           # security issues
    - exhaustive      # exhaustive enum switches (closed-set handling)
    - copyloopvar     # loop-var capture (no-op on Go >=1.22, harmless)
    - unconvert       # redundant type conversions
    - unparam         # unused function parameters/results
    - wrapcheck       # wrap errors from external packages
    # --- maintainability (merged maintainability-score slot) ---
    - cyclop          # cyclomatic complexity
    - gocognit        # cognitive complexity
    - funlen          # function length
    - nestif          # nesting depth of if-blocks
    - maintidx        # maintainability index (capped-score analog)
    - dupl            # duplicated code blocks
    # --- conventions / style ---
    - revive          # configurable golint successor (naming, arg-limit, etc.)
    - gocritic        # opinionated correctness/style/perf checks
    - goconst         # repeated string constants
    - mnd             # magic numbers
    - forbidigo       # forbid fmt.Print*/log.Print* in app code (logging convention)
    - sloglint        # log/slog hygiene
    - depguard        # import/architecture boundaries
    - lll             # line length
    - misspell        # commonly misspelled English

  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 12
    funlen:
      lines: 75
      statements: 50
    nestif:
      min-complexity: 4
    maintidx:
      # Maintainability index floor; 20 is the conventional "needs attention" line.
      under: 20
    dupl:
      threshold: 150
    lll:
      line-length: 120
      tab-width: 1
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 3
      min-occurrences: 3
    revive:
      rules:
        - name: file-length-limit       # whole-file line cap (revive >= 1.5.0)
          arguments: [{ max: 400 }]
        - name: argument-limit
          arguments: [5]
        - name: function-result-limit
          arguments: [3]
        - name: cyclomatic
          arguments: [10]
        - name: cognitive-complexity
          arguments: [12]
        - name: max-public-structs
          arguments: [5]
        - name: unhandled-error
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: var-naming
        - name: receiver-naming
        - name: context-as-argument
        - name: indent-error-flow
        - name: superfluous-else
        - name: early-return
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: "use log/slog for application logging (fmt.Print* allowed only in main/CLI/scripts via a scoped exclusion)"
        - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$
          msg: "use log/slog instead of the legacy log package"
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: "use the stdlib errors package with %w wrapping (errorlint enforces it)"
    gosec:
      excludes:
        # G104 overlaps with errcheck; keep one source of truth.
        - G104

  exclusions:
    # Skip files following the Go generated-code convention.
    generated: strict
    rules:
      # Tests are exempt from maintainability/security thresholds but still vet/errcheck.
      - path: _test\.go
        linters:
          - funlen
          - dupl
          - gosec
          - maintidx
          - cyclop
          - gocognit
          - wrapcheck
      # main packages and CLI entrypoints may print to stdout.
      - path: (^|/)(cmd|main)\.go$
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt    # stricter gofmt
    - goimports  # import grouping + missing/unused imports
    - golines    # wrap long lines
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      # Set to the project's module path so its own packages group separately.
      local-prefixes:
        - "{{MODULE_PATH}}"
    golines:
      max-len: 120
  exclusions:
    generated: strict
