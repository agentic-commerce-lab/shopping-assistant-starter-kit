# Baseline (regression-only) quality gate for a multi-project repo. Each project root
# commits its own Mago baselines (`lint-baseline.toml`, `mago-analysis-baseline.toml`)
# and raised jscpd threshold — see adoption-workflow.md.
name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.project.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        project:
          - name: api
            path: api
          - name: worker
            path: worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Setup Mago
        uses: nhedger/setup-mago@v1

      - name: Setup jscpd
        run: npm install -g jscpd@5

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: ${{ matrix.project.path }}

      - name: Verify composer scripts
        working-directory: ${{ matrix.project.path }}
        run: |
          php -r '$req=["format:check","lint","typecheck","quality:filesize","quality:dupes","quality:depcheck","quality:security"]; $c=json_decode(file_get_contents("composer.json"),true); $s=$c["scripts"]??[]; $m=array_values(array_filter($req, fn($x)=>!isset($s[$x]))); if($m){fwrite(STDERR,"Missing composer scripts: ".implode(", ",$m)."\n"); fwrite(STDERR,"Merge assets/configs/composer-scripts.fragment.json or provide intentional replacements before enabling this workflow.\n"); exit(1);} echo "All required composer scripts present\n";'

      - name: Format
        run: composer run format:check
        working-directory: ${{ matrix.project.path }}

      - name: Lint (baseline)
        run: mago lint --baseline lint-baseline.toml
        working-directory: ${{ matrix.project.path }}

      - name: Typecheck (baseline)
        run: mago analyze --baseline mago-analysis-baseline.toml
        working-directory: ${{ matrix.project.path }}

      - name: File length
        run: composer run quality:filesize
        working-directory: ${{ matrix.project.path }}

      - name: Duplication (baseline threshold)
        run: jscpd
        working-directory: ${{ matrix.project.path }}

      - name: Dependency hygiene
        run: composer run quality:depcheck
        working-directory: ${{ matrix.project.path }}

      - name: Security audit
        run: composer run quality:security
        working-directory: ${{ matrix.project.path }}

      # Advisory (non-blocking): surfaces cognitive complexity + method length.
      - name: Maintainability (advisory)
        run: composer run quality:maintainability || true
        working-directory: ${{ matrix.project.path }}
